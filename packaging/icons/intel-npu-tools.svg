<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Intel NPU Tools</title>
  <!--
    A processor die with a voice waveform cut through it: the toolkit is
    inference on a chip, driven by speech and screen text. Deliberately built
    from few, heavy shapes so it survives being drawn at 16 pixels, where thin
    strokes and small detail turn to mud. No text, because text is unreadable
    at that size and untranslatable at any.
  -->
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7ddd"/>
      <stop offset="1" stop-color="#1f4fa8"/>
    </linearGradient>
  </defs>

  <!-- Package pins. Four a side, thick enough to stay distinct when scaled. -->
  <g fill="#8c96a8">
    <rect x="20" y="14" width="9" height="10" rx="3"/>
    <rect x="39" y="14" width="9" height="10" rx="3"/>
    <rect x="58" y="14" width="9" height="10" rx="3"/>
    <rect x="77" y="14" width="9" height="10" rx="3"/>
    <rect x="20" y="104" width="9" height="10" rx="3"/>
    <rect x="39" y="104" width="9" height="10" rx="3"/>
    <rect x="58" y="104" width="9" height="10" rx="3"/>
    <rect x="77" y="104" width="9" height="10" rx="3"/>
    <rect x="14" y="20" width="10" height="9" rx="3"/>
    <rect x="14" y="39" width="10" height="9" rx="3"/>
    <rect x="14" y="58" width="10" height="9" rx="3"/>
    <rect x="14" y="77" width="10" height="9" rx="3"/>
    <rect x="104" y="20" width="10" height="9" rx="3"/>
    <rect x="104" y="39" width="10" height="9" rx="3"/>
    <rect x="104" y="58" width="10" height="9" rx="3"/>
    <rect x="104" y="77" width="10" height="9" rx="3"/>
  </g>

  <!-- The die. -->
  <rect x="22" y="22" width="84" height="84" rx="14" fill="url(#die)"/>
  <rect x="22" y="22" width="84" height="84" rx="14" fill="none" stroke="#12336b" stroke-width="3"/>

  <!-- Waveform: rounded bars, symmetric about the centre line. Bars rather
       than a polyline so nothing vanishes at small sizes. -->
  <g fill="#f2f6ff" stroke="none">
    <rect x="37" y="57" width="7" height="14" rx="3.5"/>
    <rect x="49" y="47" width="7" height="34" rx="3.5"/>
    <rect x="61" y="38" width="7" height="52" rx="3.5"/>
    <rect x="73" y="50" width="7" height="28" rx="3.5"/>
    <rect x="85" y="59" width="7" height="10" rx="3.5"/>
  </g>
</svg>
