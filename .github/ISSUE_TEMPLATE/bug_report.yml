name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove private data from logs and screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Processor and NPU PCI ID
      placeholder: Core Ultra 9 285K, 8086:ad1d
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
      placeholder: Ubuntu 24.04, Linux 6.17
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Commands and logs
      description: Include intel-npu-info and relevant intel_vpu logs.
      render: shell
