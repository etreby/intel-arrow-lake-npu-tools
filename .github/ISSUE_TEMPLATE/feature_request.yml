name: Feature request
description: Propose a useful, scoped improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: input
    id: hardware
    attributes:
      label: Relevant hardware or desktop environment
