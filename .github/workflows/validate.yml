name: Validate

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Compile Python
        run: python -m compileall -q src tests scripts/download-models.py
      - name: Run unit tests
        run: |
          python -m pip install pytest build twine numpy "mcp>=2,<3"
          PYTHONPATH=src pytest -q
      - name: Verify the MCP entry point imports
        # OpenVINO is not installed here, so this also proves the heavy
        # inference imports stay lazy and the server starts on any machine.
        run: PYTHONPATH=src python -c "from intel_npu_tools import mcp_server, ocr, audio, info, semantic"
      - name: Validate shell
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh
          shellcheck install.sh uninstall.sh scripts/*.sh
      - name: Build and check release artifacts
        run: |
          python -m build
          python -m twine check dist/*
