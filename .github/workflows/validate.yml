name: Validate

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Run unit tests
        run: |
          python -m pip install pytest build twine numpy "mcp>=2,<3"
          PYTHONPATH=src pytest -q
      - name: Verify the MCP entry point imports
        # OpenVINO is not installed here, so this also proves the heavy
        # inference imports stay lazy and the server starts on any machine.
        run: PYTHONPATH=src python -c "from intel_npu_tools import mcp_server, ocr, audio, info, semantic, runtime, context_filter, rerank, config, desktop, panel"
      - name: Validate desktop entries and build a package
        run: |
          sudo apt-get install -y desktop-file-utils librsvg2-bin
          ./scripts/build-deb.sh dist
          dpkg-deb --contents dist/*.deb | grep -q 'usr/bin/intel-npu-panel'
          mkdir -p /tmp/debcheck && dpkg-deb -x dist/*.deb /tmp/debcheck
          for entry in /tmp/debcheck/usr/share/applications/*.desktop; do
            desktop-file-validate "$entry"
          done
          # Models and build residue must never end up in a package.
          ! find /tmp/debcheck \( -name '*.bin' -o -name '__pycache__' -o -name '*.egg-info' \) | grep -q .
      - name: Build the RPM and exercise the PKGBUILD
        run: |
          # rpmbuild runs on Debian, so the spec is checked on every push rather
          # than only when someone happens to have a Fedora machine. The
          # PKGBUILD cannot be built without makepkg, but its package()
          # function is the part that installs files, so it is run directly
          # with the variables makepkg would set.
          sudo apt-get install -y rpm
          rpmbuild -bb packaging/intel-npu-tools.spec \
            --define "_topdir $PWD/rpmbuild" --define "_projectdir $PWD" 2>&1 | tee /tmp/rpm.log
          # rpmbuild exits 0 on warnings, so they are failed explicitly.
          ! sed -n '/RPM build warnings/,$p' /tmp/rpm.log | grep -q '[^[:space:]]' \
            || { sed -n '/RPM build warnings/,$p' /tmp/rpm.log; exit 1; }
          rpm -qlp rpmbuild/RPMS/noarch/*.rpm | grep -q '/usr/bin/intel-npu-panel'
          ( set -e
            startdir="$PWD/packaging"; pkgdir="$PWD/archpkg"; srcdir="$PWD/archsrc"
            mkdir -p "$srcdir"; cd packaging; source ./PKGBUILD; package )
          test -x archpkg/usr/bin/intel-npu-panel
          test -f archpkg/usr/share/licenses/intel-npu-tools/LICENSE
      - name: Validate shell
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh packaging/intel-npu-tools-setup
          shellcheck install.sh uninstall.sh scripts/*.sh packaging/intel-npu-tools-setup
      - name: Build and check release artifacts
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
