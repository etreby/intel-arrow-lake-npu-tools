name: Validate

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Run unit tests
        run: |
          python -m pip install pytest build twine numpy "mcp>=2,<3"
          PYTHONPATH=src pytest -q
      - name: Verify the MCP entry point imports
        # OpenVINO is not installed here, so this also proves the heavy
        # inference imports stay lazy and the server starts on any machine.
        run: PYTHONPATH=src python -c "from intel_npu_tools import mcp_server, ocr, audio, info, semantic, runtime, context_filter, rerank, config, desktop, panel"
      - name: Validate desktop entries and build a package
        run: |
          sudo apt-get install -y desktop-file-utils librsvg2-bin
          ./scripts/build-deb.sh dist
          dpkg-deb --contents dist/*.deb | grep -q 'usr/bin/intel-npu-panel'
          mkdir -p /tmp/debcheck && dpkg-deb -x dist/*.deb /tmp/debcheck
          for entry in /tmp/debcheck/usr/share/applications/*.desktop; do
            desktop-file-validate "$entry"
          done
          # Models and build residue must never end up in a package. find's own
          # failure counts as a failure: piping it into grep would turn an
          # unreadable tree into an empty result, which reads as nothing found.
          residue=$(find /tmp/debcheck \( -name '*.bin' -o -name '__pycache__' -o -name '*.egg-info' \) -print)
          if [ -n "$residue" ]; then
            printf 'packaged residue:\n%s\n' "$residue"
            exit 1
          fi
      - name: Fail the RPM build on warnings
        run: |
          # The install-fedora and install-opensuse jobs below build this spec
          # for real, on the distributions it targets, so this is no longer
          # where the spec is proven to work. What it still does that they do
          # not is refuse a build that only warns: rpmbuild exits 0 on
          # warnings, and a warning is how an unpackaged file announces itself.
          sudo apt-get install -y rpm
          # Without pipefail a failing rpmbuild is hidden by tee's success, and
          # a build that produced no RPM at all also emits no warning section,
          # so the check below would find nothing wrong and pass.
          set -o pipefail
          # --nodeps because rpm's database on a Debian runner is empty, so no
          # BuildRequires can ever be satisfied here however correct it is.
          # The three container jobs build the same spec with the check live,
          # which is where a wrong build dependency actually gets caught.
          rpmbuild -bb --nodeps packaging/intel-npu-tools.spec \
            --define "_topdir $PWD/rpmbuild" --define "_projectdir $PWD" 2>&1 | tee /tmp/rpm.log
          warnings=$(sed -n '/RPM build warnings/,$p' /tmp/rpm.log)
          if printf '%s' "$warnings" | grep -q '[^[:space:]]'; then
            printf '%s\n' "$warnings"
            exit 1
          fi
      - name: Check the AUR PKGBUILD has not drifted
        # It is generated from packaging/PKGBUILD so the two cannot end up
        # disagreeing about dependencies. This only compares metadata, so it
        # needs no network and does not care which version is pinned.
        run: ./scripts/update-aur-pkgbuild.sh --check
      - name: Validate shell
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh packaging/intel-npu-tools-setup
          shellcheck install.sh uninstall.sh scripts/*.sh packaging/intel-npu-tools-setup
      - name: Build and check release artifacts
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz

  # The jobs below install each native package on a distribution it is for.
  # Building a package proves the spec is syntactically sound but cannot
  # prove a single dependency name is real — and the RPM spec picks different
  # names per distribution with an %if, so it is built three times, once per
  # branch it can take. These do.
  #
  # None of them runs a wrapper or intel-npu-tools-setup: those bootstrap a
  # virtual environment and download models, which is deliberately not what
  # installing the package does.

  install-debian:
    runs-on: ubuntu-24.04
    container: debian:stable
    steps:
      - name: Install the build and packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates fakeroot librsvg2-bin desktop-file-utils python3
      - name: Let the container install documentation
        # The Debian images exclude share/doc with a dpkg path-exclude, for the
        # same size reasons as the RPM and Arch images.
        run: rm -f /etc/dpkg/dpkg.cfg.d/docker
      - uses: actions/checkout@v7
      - name: Build the .deb
        run: ./scripts/build-deb.sh dist
      - name: Install it, which resolves every hard dependency
        run: apt-get install -y ./dist/*.deb
      - name: Check every dependency name means something here
        run: ./scripts/verify-package-deps.sh dist/*.deb
      - name: Check what landed on the system
        run: ./scripts/verify-installed-tree.sh
      - name: Remove it again, and take away everything it owned
        run: |
          ./scripts/package-files.sh --with-state > /tmp/owned.txt
          apt-get remove -y intel-npu-tools
          ./scripts/verify-removed-tree.sh /tmp/owned.txt

  install-enterprise-linux:
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - name: Install the build and packaging tools
        # Enterprise Linux carries neither tesseract nor an unencumbered ffmpeg
        # in its own repositories, so EPEL is not optional here. CRB carries
        # some of what EPEL itself builds against.
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            git rpm-build librsvg2-tools desktop-file-utils
      - name: Let the container install documentation
        run: |
          if [ -f /etc/dnf/dnf.conf ]; then
            sed -i '/^tsflags=/d' /etc/dnf/dnf.conf
          fi
      - uses: actions/checkout@v7
      - name: Build the RPM on Enterprise Linux itself
        run: |
          rpmbuild -bb packaging/intel-npu-tools.spec \
            --define "_topdir $PWD/rpmbuild" --define "_projectdir $PWD"
      - name: Install it, which resolves every hard dependency
        run: dnf install -y ./rpmbuild/RPMS/noarch/*.rpm
      - name: Check every dependency name means something here
        run: ./scripts/verify-package-deps.sh rpmbuild/RPMS/noarch/*.rpm
      - name: Check what landed on the system
        run: ./scripts/verify-installed-tree.sh
      - name: Remove it again, and take away everything it owned
        run: |
          ./scripts/package-files.sh --with-state > /tmp/owned.txt
          dnf remove -y intel-npu-tools
          ./scripts/verify-removed-tree.sh /tmp/owned.txt

  install-fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install the build and packaging tools
        # git is what lets actions/checkout clone rather than fall back to the
        # REST API; librsvg2-tools is needed at build time because the staging
        # script rasterises the icon and silently ships only the SVG without it.
        run: dnf install -y --setopt=install_weak_deps=False
             git rpm-build librsvg2-tools desktop-file-utils
      - name: Let the container install documentation
        # The Fedora image sets tsflags=nodocs to stay small, which would drop
        # the files this package installs under share/doc and make a correct
        # package look incomplete.
        run: |
          if [ -f /etc/dnf/dnf.conf ]; then
            sed -i '/^tsflags=/d' /etc/dnf/dnf.conf
          fi
      - uses: actions/checkout@v7
      - name: Build the RPM on Fedora itself
        run: |
          rpmbuild -bb packaging/intel-npu-tools.spec \
            --define "_topdir $PWD/rpmbuild" --define "_projectdir $PWD"
      - name: Install it, which resolves every hard dependency
        run: dnf install -y ./rpmbuild/RPMS/noarch/*.rpm
      - name: Check every dependency name means something here
        run: ./scripts/verify-package-deps.sh rpmbuild/RPMS/noarch/*.rpm
      - name: Check what landed on the system
        run: ./scripts/verify-installed-tree.sh
      - name: Remove it again, and take away everything it owned
        run: |
          ./scripts/package-files.sh --with-state > /tmp/owned.txt
          dnf remove -y intel-npu-tools
          ./scripts/verify-removed-tree.sh /tmp/owned.txt

  install-opensuse:
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed
    steps:
      - name: Install the build and packaging tools
        run: zypper --non-interactive install --no-recommends
             git rpm-build rsvg-convert desktop-file-utils tar gzip
      - name: Let the container install documentation
        # Same size optimisation as the Fedora image, and it lives in neither
        # of the places it looks like it should.
        # The vendor zypp.conf says nothing about documentation and no rpm
        # macro does either: the image excludes it with a drop-in named
        # excludedocs.conf. A drop-in in /etc shadows the one of the same name
        # under /usr/etc, so this has to reuse that name rather than pick one
        # that sorts after it — 9 sorts before e, and the image would win.
        run: |
          mkdir -p /etc/zypp/zypp.conf.d
          printf '[main]\nrpm.install.excludedocs = no\n' \
            > /etc/zypp/zypp.conf.d/excludedocs.conf
          grep -rs excludedocs /etc/zypp/zypp.conf.d /usr/etc/zypp/zypp.conf.d || true
      - uses: actions/checkout@v7
      - name: Build the RPM on openSUSE itself
        # This is the build that takes the suse_version branch of the spec, so
        # it is the only one that produces the openSUSE dependency names.
        run: |
          rpmbuild -bb packaging/intel-npu-tools.spec \
            --define "_topdir $PWD/rpmbuild" --define "_projectdir $PWD"
      - name: Install it, which resolves every hard dependency
        # Locally built, so it carries no signature.
        run: zypper --non-interactive install --allow-unsigned-rpm ./rpmbuild/RPMS/noarch/*.rpm
      - name: Check every dependency name means something here
        run: ./scripts/verify-package-deps.sh rpmbuild/RPMS/noarch/*.rpm
      - name: Check what landed on the system
        run: ./scripts/verify-installed-tree.sh
      - name: Remove it again, and take away everything it owned
        run: |
          ./scripts/package-files.sh --with-state > /tmp/owned.txt
          zypper --non-interactive remove intel-npu-tools
          ./scripts/verify-removed-tree.sh /tmp/owned.txt

  install-arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install the build and packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git librsvg desktop-file-utils sudo
      - name: Let the container install documentation
        # The Arch image lists share/doc under NoExtract for the same reason.
        run: sed -i '/^NoExtract/d' /etc/pacman.conf
      - uses: actions/checkout@v7
      - name: Make an unprivileged user, because makepkg refuses to run as root
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build the package with a real makepkg run
        # -s installs the declared dependencies, so a name that does not exist
        # in the Arch repositories fails here rather than at someone's install.
        run: sudo -u builder bash -c 'cd packaging && makepkg -s --noconfirm'
      - name: Install it
        run: pacman -U --noconfirm packaging/*.pkg.tar.zst
      - name: Check every dependency name means something here
        run: ./scripts/verify-package-deps.sh packaging/*.pkg.tar.zst
      - name: Check what landed on the system
        run: ./scripts/verify-installed-tree.sh
      - name: Remove it again, and take away everything it owned
        run: |
          ./scripts/package-files.sh --with-state > /tmp/owned.txt
          pacman -R --noconfirm intel-npu-tools
          ./scripts/verify-removed-tree.sh /tmp/owned.txt

  install-arch-from-aur:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install the build and packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git librsvg desktop-file-utils sudo
      - name: Let the container install documentation
        run: sed -i '/^NoExtract/d' /etc/pacman.conf
      - uses: actions/checkout@v7
      - name: Make an unprivileged user, because makepkg refuses to run as root
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build it the way the AUR would
        # Fetches the released tarball named in the PKGBUILD and checks it
        # against the recorded sha256sum, which is the part that distinguishes
        # this from the working-tree build the install-arch job does. It
        # therefore tests the last release, not this commit.
        run: sudo -u builder bash -c 'cd packaging/aur && makepkg -s --noconfirm'
      - name: Install it
        run: pacman -U --noconfirm packaging/aur/*.pkg.tar.zst
      - name: Check every dependency name means something here
        run: ./scripts/verify-package-deps.sh packaging/aur/*.pkg.tar.zst
      - name: Check what landed on the system
        run: ./scripts/verify-installed-tree.sh
      - name: Remove it again, and take away everything it owned
        run: |
          ./scripts/package-files.sh --with-state > /tmp/owned.txt
          pacman -R --noconfirm intel-npu-tools
          ./scripts/verify-removed-tree.sh /tmp/owned.txt
