name: Release

# Runs when a version tag is pushed. Builds the three artifacts, attaches them
# to a GitHub release, and republishes the signed apt repository to Pages.
#
# The signing key is never in this repository. It is held as the
# APT_GPG_PRIVATE_KEY secret and imported into the runner for the length of one
# job; without it the apt job is skipped rather than publishing an unsigned
# repository that modern apt would refuse anyway.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  artifacts:
    name: Build and attach artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that disagrees with the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$project" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $project." >&2
            exit 1
          fi

      - name: Build wheel, sdist and .deb
        run: |
          sudo apt-get update || true
          sudo apt-get install -y librsvg2-bin desktop-file-utils
          python -m pip install --quiet build
          python -m build
          ./scripts/build-deb.sh dist

      - name: Check the package before publishing it
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*.whl dist/*.tar.gz
          mkdir -p /tmp/debcheck && dpkg-deb -x dist/*.deb /tmp/debcheck
          for entry in /tmp/debcheck/usr/share/applications/*.desktop; do
            desktop-file-validate "$entry"
          done
          # A model or a build artefact inside a package would be a licensing
          # problem as much as a size one.
          ! find /tmp/debcheck \( -name '*.bin' -o -name '__pycache__' -o -name '*.egg-info' \) | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Intel NPU Tools ${{ steps.version.outputs.version }}" \
            --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md) \
            dist/*.whl dist/*.tar.gz dist/*.deb

  apt:
    name: Publish the signed apt repository
    needs: artifacts
    runs-on: ubuntu-24.04
    # Skipped rather than failed when no key is configured, so the release
    # itself still succeeds on a fork or before the secret exists.
    if: ${{ github.repository_owner == 'etreby' }}
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Import the signing key
        id: key
        env:
          PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "No APT_GPG_PRIVATE_KEY secret; skipping the apt repository." >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update || true
          sudo apt-get install -y apt-utils gnupg
          printf '%s' "$PRIVATE_KEY" | gpg --batch --import
          # A passphrase-protected key cannot sign unattended without this.
          if [ -n "$PASSPHRASE" ]; then
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "passphrase $PASSPHRASE" >> ~/.gnupg/gpg.conf
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build the repository
        if: steps.key.outputs.available == 'true'
        run: |
          ./scripts/build-apt-repo.sh public/apt dist/*.deb
          # A landing page, so the Pages URL is not a bare directory listing.
          mkdir -p public
          sed -e "s|@REPO_URL@|https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}|g" \
            packaging/apt-index.html.in > public/index.html

      - uses: actions/configure-pages@v5
        id: pages
        if: steps.key.outputs.available == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.available == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.key.outputs.available == 'true'
